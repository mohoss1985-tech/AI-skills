    - { payment_id: pay_0005, card_id: crd_hb_005, amount_minor: 21900, status: captured, captured_at: "2026-10-30", three_ds: authenticated, channel: ecom, merchant: "M-011 QuickGift Codes (demo)" }

# ---------------------------------------------------------------- ready-made test cases
x-test-cases:
  - id: TK-01
    name: Green path - card added to Apple Pay at once
    request: { method: POST, path: /tokens, body: { pan: "4000000000001014", expiry: "2029-04", wallet: apple_pay, token_requestor_id: "40010030273", device_id: dev_iphone_demo_01, device_risk: low, wallet_account_age_days: 400 } }
    assert: [ "status == 201", "body.decision == 'green'", "body.status == 'active'", "body.token_masked startsWith '400099'", "body has no field 'pan'", "body.par matches ^[A-Z0-9]{29}$", "body.demo_only == true" ]
  - id: TK-02
    name: Yellow path - one-time code activates the token
    steps:
      - { request: { method: POST, path: /tokens, body: { pan: "4000000000001087", expiry: "2029-05", wallet: apple_pay, token_requestor_id: "40010030273", device_id: dev_iphone_demo_02, device_risk: medium, wallet_account_age_days: 3 } }, assert: [ "body.decision == 'yellow'", "body.status == 'pending_idv'" ] }
      - { request: { method: POST, path: "/tokens/{{token_ref}}/idv", body: { method: sms_otp, otp: "000000" } }, assert: [ "status == 422", "body.rule == 'T9'" ] }
      - { request: { method: POST, path: "/tokens/{{token_ref}}/idv", body: { method: sms_otp, otp: "123456" } }, assert: [ "status == 200", "body.status == 'active'" ] }
  - id: TK-03
    name: Red path - blocked or fraud-watch cards get no token
    request: { method: POST, path: /tokens, body: { pan: "{{pan}}", expiry: "{{expiry}}", wallet: apple_pay, token_requestor_id: "40010030273", device_id: dev_x, device_risk: low } }
    data:
      - { pan: "4000000000001050", expiry: "2029-01", expect_reason: card_blocked_stolen }
      - { pan: "4000000000001069", expiry: "2029-02", expect_reason: fraud_watch }
      - { pan: "4000000000001032", expiry: "2026-09", expect_reason: card_expired }
    assert: [ "status == 201", "body.decision == 'red'", "body.token_ref == null", "body.decision_reason == {{expect_reason}}" ]
  - id: TK-04
    name: Demo cryptogram is single-use and respects domain restrictions
    steps:
      - { request: { method: POST, path: /tokens/TRF-HB-0001/cryptogram, body: { amount_minor: 4250, currency: EUR, channel: in_app } }, assert: [ "status == 200", "body.cryptogram startsWith 'FAKE'", "body.demo_only == true" ] }
      - { request: { method: POST, path: /payments, body: { payment_token: { token_ref: TRF-HB-0001, cryptogram: "{{cryptogram}}" }, amount_minor: 4250, currency: EUR, channel: in_app } }, assert: [ "status == 201", "body.response_code == '00'", "body.wallet == true" ] }
      - { request: { method: POST, path: /payments, body: { payment_token: { token_ref: TRF-HB-0001, cryptogram: "{{cryptogram}}" }, amount_minor: 4250, currency: EUR, channel: in_app } }, assert: [ "status == 422", "body.rule == 'T18'" ] }
      - { request: { method: POST, path: /tokens/TRF-HB-0001/cryptogram, body: { amount_minor: 1000, currency: EUR, channel: card_on_file } }, assert: [ "status == 422", "body.rule == 'T17'" ] }
    precondition: TK-01 ran (token TRF-HB-0001 active)
  - id: TK-05
    name: Storyline - stolen card suspends the token, no cryptogram, PAN update on the replacement card
    steps:
      - { request: { method: POST, path: /tokens, body: { pan: "4000000000001087", expiry: "2029-05", wallet: apple_pay, token_requestor_id: "40010030273", device_id: dev_iphone_demo_03, device_risk: low, wallet_account_age_days: 500 } }, assert: [ "body.status == 'active'" ] }
      - { request: { method: POST, path: /cards/crd_hb_008/block, body: { reason: stolen, channel: app } }, assert: [ "status == 200", "every body.wallet_tokens.status == 'suspended'" ] }
      - { request: { method: POST, path: "/tokens/{{token_ref}}/cryptogram", body: { amount_minor: 1000, currency: EUR, channel: contactless } }, assert: [ "status == 422", "body.rule == 'T16'" ] }
      - { request: { method: POST, path: "/tokens/{{token_ref}}/resume", body: { reason: card_blocked_stolen } }, assert: [ "status == 422", "body.rule == 'T13'" ] }
      - { request: { method: POST, path: "/tokens/{{token_ref}}/resume", body: { reason: card_replaced, requested_by: issuer, new_card_id: crd_hb_008_r1 } }, assert: [ "status == 200", "body.status == 'active'", "body.card_id == 'crd_hb_008_r1'", "body.par unchanged" ] }
  - id: TK-06
    name: Lifecycle transitions - delete is final
    steps:
      - { request: { method: POST, path: /tokens/TRF-HB-0001/resume, body: { reason: cardholder_request } }, assert: [ "status == 409", "body.rule == 'T12'" ] }
      - { request: { method: POST, path: /tokens/TRF-HB-0001/suspend, body: { reason: device_lost, requested_by: cardholder } }, assert: [ "status == 200", "body.status == 'suspended'" ] }
      - { request: { method: POST, path: /tokens/TRF-HB-0001/delete, body: { reason: cardholder_request } }, assert: [ "status == 200", "body.status == 'deleted'" ] }
      - { request: { method: POST, path: /tokens/TRF-HB-0001/resume, body: { reason: device_found } }, assert: [ "status == 409", "body.type endsWith 'token-deleted'" ] }
  - id: PL-01
    name: Cancel before clearing is a reversal, not a refund
    steps:
      - { request: { method: POST, path: /payments/pay_0003/refunds, body: { amount_minor: 6500, reason: service_cancelled } }, assert: [ "status == 409", "body.rule == 'R1'" ] }
      - { request: { method: POST, path: /payments/pay_0003/reversal, body: { reason: customer_cancelled } }, assert: [ "status == 200", "body.status == 'reversed'", "body.reversed_minor == 6500" ] }
      - { request: { method: POST, path: /payments/pay_0003/capture }, assert: [ "status == 409", "body.rule == 'P3'" ] }
  - id: PL-02
    name: After clearing, cancel becomes a refund (partial)
    steps:
      - { request: { method: POST, path: /payments/pay_0001/reversal }, assert: [ "status == 409", "body.rule == 'P6'", "body.detail contains 'refunds'" ] }
      - { request: { method: POST, path: /payments/pay_0001/refunds, body: { amount_minor: 4000, reason: goods_returned } }, assert: [ "status == 201", "body.status == 'partially_refunded'", "body.refunded_minor == 4000" ] }
      - { request: { method: POST, path: /payments/pay_0001/refunds, body: { amount_minor: 8001 } }, assert: [ "status == 422", "body.rule == 'R2'" ] }
  - id: PL-03
    name: Goods not received - merchant wins with proof of delivery
    steps:
      - { request: { method: POST, path: /payments/pay_0002/disputes, body: { condition_code: "13.1", amount_minor: 8900, expected_delivery_date: "2026-10-20" } }, assert: [ "status == 201", "body.workflow == 'collaboration'", "body.status == 'chargeback'", "body.respond_by == '2026-12-08'" ] }
      - { request: { method: POST, path: "/disputes/{{dispute_id}}/representment", body: { evidence: [proof_of_delivery, signed_delivery] } }, assert: [ "status == 200", "body.status == 'won'", "body.liability == 'issuer'" ] }
      - { request: { method: POST, path: /payments/pay_0002/refunds, body: { amount_minor: 100 } }, assert: [ "status == 201" ], note: "dispute closed, refund allowed again" }
  - id: PL-04
    name: Fraud on a stolen card - liability depends on 3-D Secure
    steps:
      - { request: { method: POST, path: /payments/pay_0005/disputes, body: { condition_code: "10.4", amount_minor: 21900, fraud_report_id: FR-2026-1301 } }, assert: [ "status == 422", "body.rule == 'D9'" ] }
      - { request: { method: POST, path: /payments/pay_0004/disputes, body: { condition_code: "10.4", amount_minor: 34900 } }, assert: [ "status == 422", "body.type endsWith 'fraud-report-required'" ] }
      - { request: { method: POST, path: /payments/pay_0004/disputes, body: { condition_code: "10.4", amount_minor: 34900, fraud_report_id: FR-2026-1301 } }, assert: [ "status == 201", "body.workflow == 'allocation'", "body.liability == 'merchant'" ] }
  - id: PL-05
    name: Missed response window - merchant loses by default
    steps:
      - { request: { method: POST, path: /payments/pay_0002/disputes, body: { condition_code: "13.1", amount_minor: 8900, expected_delivery_date: "2026-10-20" } }, assert: [ "status == 201" ] }
      - { request: { method: POST, path: /_mock/clock, body: { advance_days: 31 } }, assert: [ "body.today == '2026-12-09'" ] }
      - { request: { method: POST, path: "/disputes/{{dispute_id}}/representment", body: { evidence: [proof_of_delivery] } }, assert: [ "status == 422", "body.rule == 'D12'" ] }
  - id: PL-06
    name: Weak evidence - pre-arbitration then arbitration with fee
    steps:
      - { request: { method: POST, path: /payments/pay_0002/disputes, body: { condition_code: "13.1", amount_minor: 8900, expected_delivery_date: "2026-10-20" } }, assert: [ "status == 201" ] }
      - { request: { method: POST, path: "/disputes/{{dispute_id}}/representment", body: { evidence: [tracking_only] } }, assert: [ "body.status == 'pre_arbitration'" ] }
      - { request: { method: POST, path: "/disputes/{{dispute_id}}/pre-arbitration", body: { accept: false } }, assert: [ "body.status == 'lost'", "body.ledger[-1].debit == 'merchant'", "body has field fee_minor" ] }

x-cb-twin:
  labels_fr: { tokens: "jeton (token) / numéro de compte de l'appareil", idv: "vérification d'identité (ID&V)", reversal: "annulation (avant remise)", refund: "remboursement / avoir", dispute: "impayé", representment: "représentation", pre-arbitration: "pré-arbitrage (*to confirm* terme CB)" }
  differences:
    - "TSP for CB-routed tokens: CB tokenisation service (public detail limited; *to confirm*). Co-badged Visa/CB cards may hold a token per network: *to confirm*."
    - "Disputes: impayé motifs and deadlines are in the CB rulebook (not public) - the mock accepts 10.x-13.x labelled in French and marks every CB code *to confirm*."
    - "Unauthorised payment reported by the cardholder: refund by the end of the next business day (CMF L133-18), within 13 months of the debit (L133-24). The mock returns refund_due_by and contest_until on FR disputes."
