    - { payment_id: pay_0002, card_id: crd_hb_001, amount_minor: 8900,  status: captured, captured_at: "2026-10-12", three_ds: none, channel: ecom, merchant: "M-007 Atlas Home (demo)", expected_delivery_date: "2026-10-20" }
    - { payment_id: pay_0003, card_id: crd_hb_008, amount_minor: 6500,  status: authorised, channel: pos, merchant: "M-002 Harbour Hotel (demo)" }
