  token_requestors:
    - { token_requestor_id: "40010030273", name: Apple Pay (demo TRID), type: wallet, device_bound: true }
    - { token_requestor_id: "40010075001", name: Google Pay (demo TRID), type: wallet, device_bound: true }
    - { token_requestor_id: "40010099001", name: QuickGift Codes card-on-file (demo), type: merchant, device_bound: false }
  token_numbers:   # fictional 400099 range, Luhn-valid, never routable; assigned in order
    - "4000990000000012"
    - "4000990000000020"
    - "4000990000000038"
    - "4000990000000046"
    - "4000990000000053"
  provisioning_expectations:
    - { card_id: crd_hb_001, device_risk: low,    expect: green }
    - { card_id: crd_hb_008, device_risk: medium, expect: "yellow (OTP 123456)" }
    - { card_id: crd_hb_006, device_risk: low,    expect: "red (fraud watch)" }
    - { card_id: crd_hb_005, device_risk: low,    expect: "red (blocked stolen)" }
    - { card_id: crd_hb_003, device_risk: low,    expect: "red (expired)" }
