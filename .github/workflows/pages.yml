# Publishes the Analyst Kit demo to GitHub Pages on every push to main:
#   /     V2, built from this commit (app/server/export_static.py)
#   /v1/  V1, built from the frozen git tag v1.0.0 (skipped with a warning while the tag does not exist)
name: Publish demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the V1 build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend tests
        run: python3 -m unittest discover -s app/server/tests -t app/server
      - name: Build V2 into dist/
        run: python3 app/server/export_static.py dist
      - name: Build V1 from tag v1.0.0 into dist/v1/
        run: |
          if git rev-parse -q --verify "refs/tags/v1.0.0^{commit}" >/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/v1" v1.0.0
            python3 "$RUNNER_TEMP/v1/app/export_static.py" "$GITHUB_WORKSPACE/dist/v1"
            git worktree remove --force "$RUNNER_TEMP/v1"
          else
            echo "::warning::Tag v1.0.0 not found: V1 is not published at /v1/ in this build."
          fi
      - name: Check the build
        run: test -f dist/index.html && test -f dist/config.js && test -f dist/data/catalog.json && test -f dist/data/state.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
