# ---------------------------------------------------------------- ready-made test cases
x-test-cases:
  - id: TC-01
    name: No API key is refused
    request: { method: GET, path: /cards/crd_hb_001, headers: {} }
    assert: [ "status == 401", "body.type endsWith 'unauthorized'" ]
  - id: TC-02
    name: Card read never exposes the PAN
    request: { method: GET, path: /cards/crd_hb_001 }
    assert: [ "status == 200", "body.status == 'active'", "body.pan_masked == '400000******1014'", "body has no field 'pan'", "response time < 500 ms" ]
  - id: TC-03
    name: Approved contactless payment
    request: { method: POST, path: /authorisations, body: { pan: "4000000000001014", expiry: "2029-04", amount_minor: 4250, currency: EUR, channel: pos, entry_mode: CONTACTLESS } }
    assert: [ "status == 200", "body.response_code == '00'", "body.approved == true", "body.stip == false", "body.auth_code matches ^[A-Z0-9]{6}$" ]
  - id: TC-04
    name: Each decline code (data-driven, one row per card)
    request: { method: POST, path: /authorisations, body: { pan: "{{pan}}", expiry: "{{expiry}}", amount_minor: 8000, currency: EUR, channel: "{{channel}}" } }
    data:
      - { pan: "4000000000001023", expiry: "2028-06", channel: pos,  expect: "51" }
      - { pan: "4000000000001032", expiry: "2026-09", channel: pos,  expect: "54" }
      - { pan: "4000000000001041", expiry: "2028-11", channel: pos,  expect: "41" }
      - { pan: "4000000000001050", expiry: "2029-01", channel: pos,  expect: "43" }
      - { pan: "4000000000001069", expiry: "2029-02", channel: ecom, expect: "59" }
    assert: [ "status == 200", "body.response_code == {{expect}}", "body.approved == false", "body.auth_code == null" ]
  - id: TC-05
    name: Stand-In Processing decides when the issuer is down
    steps:
      - { request: { method: POST, path: /authorisations, body: { pan: "4000000000001078", expiry: "2029-03", amount_minor: 4500,  currency: EUR, channel: pos } }, assert: [ "body.response_code == '00'", "body.stip == true" ] }
      - { request: { method: POST, path: /authorisations, body: { pan: "4000000000001078", expiry: "2029-03", amount_minor: 25000, currency: EUR, channel: pos } }, assert: [ "body.response_code == '05'", "body.stip == true" ] }
  - id: TC-06
    name: Block as stolen, then the card is refused with 43 and wallet tokens are suspended
    steps:
      - { request: { method: POST, path: /cards/crd_hb_008/block, body: { reason: stolen, channel: app, declared_by: cardholder } }, assert: [ "status == 200", "body.status == 'blocked'", "body.block.exception_file == 'listed'", "every body.wallet_tokens.status == 'suspended'", "body.replacement.ordered == true" ] }
      - { request: { method: POST, path: /authorisations, body: { pan: "4000000000001087", expiry: "2029-05", amount_minor: 1000, currency: EUR, channel: pos } }, assert: [ "body.response_code == '43'" ] }
      - { request: { method: POST, path: /cards/crd_hb_008/block, body: { reason: lost, channel: app } }, assert: [ "status == 409", "body.rule == 'B2'" ] }
  - id: TC-07
    name: A stolen card cannot be unblocked; a lost one can
    steps:
      - { request: { method: POST, path: /cards/crd_hb_005/unblock }, assert: [ "status == 422", "body.type endsWith 'unblock-not-allowed'" ] }
      - { request: { method: POST, path: /cards/crd_hb_008/block, body: { reason: lost, channel: app } }, assert: [ "status == 200" ] }
      - { request: { method: POST, path: /cards/crd_hb_008/unblock }, assert: [ "status == 200", "body.status == 'active'", "body.block == null" ] }
  - id: TC-08
    name: Fraud report sent once per transaction
    steps:
      - { request: { method: POST, path: /fraud-reports, body: { transaction_id: "74000002305000000004418", card_id: crd_hb_005, fraud_type: "6", case_id: CASE-2026-0412 } }, assert: [ "status == 201", "body.status == 'sent'", "body.fraud_report_id matches ^FR-" ] }
      - { request: { method: POST, path: /fraud-reports, body: { transaction_id: "74000002305000000004418", card_id: crd_hb_005, fraud_type: "6", case_id: CASE-2026-0412 } }, assert: [ "status == 409" ] }
      - { request: { method: POST, path: /fraud-reports, body: { transaction_id: "74000002305000000005502", card_id: crd_hb_002, fraud_type: "6", case_id: CASE-2026-0413 } }, assert: [ "status == 422", "body.rule == 'F3'" ] }
  - id: TC-09
    name: Fraud dispute needs the fraud report first
    steps:
      - { request: { method: POST, path: /disputes, body: { transaction_id: "74000002305000000004418", condition_code: "10.4", amount_minor: 12990, currency: EUR } }, assert: [ "status == 422", "body.type endsWith 'fraud-report-required'" ] }
      - { request: { method: POST, path: /disputes, body: { transaction_id: "74000002305000000001187", condition_code: "10.4", amount_minor: 8990, currency: EUR, fraud_report_id: FR-2026-1182 } }, assert: [ "status == 409", "body.type endsWith 'dispute-already-open'" ] }
  - id: TC-10
    name: 120-day limit, inclusive
    steps:
      - { request: { method: POST, path: /disputes, body: { transaction_id: "74000002305000000002265", condition_code: "13.1", amount_minor: 5400, currency: EUR } }, assert: [ "status == 201", "body.status == 'submitted'", "header Location startsWith /disputes/" ] }
      - { request: { method: POST, path: /disputes, body: { transaction_id: "74000002305000000003349", condition_code: "13.1", amount_minor: 3200, currency: EUR } }, assert: [ "status == 422", "body.rule == 'D2'" ] }
      - { request: { method: POST, path: /disputes, body: { transaction_id: "74000002305000000002265", condition_code: "13.1", amount_minor: 5401, currency: EUR } }, assert: [ "status == 409 or status == 422" ], note: "D5 is checked before D4 - order to confirm with dev" }

# ---------------------------------------------------------------- CB twin
x-cb-twin:
  issuer: Banque Lumière
  server: mock://lumiere/v1
  api_key: bl_test_demo_key
  labels_fr: { block: mise en opposition, fraud-reports: déclaration de fraude au GIE CB, disputes: impayé, stip: traitement de secours (STIP CB - *to confirm* name) }
  differences:
    - "Authorisation: same ISO 8583 codes; CB2A field names and any CB-specific code use are *to confirm* against the CB2A spec (not public)."
    - "crd_bl_003: issuer down without fallback → 91 (no stand-in)."
    - "crd_bl_002: opposition for fraudulent use → 05 (issuer choice, mirrors the Visa SFD)."
    - "Opposition: unauthorised transactions refunded by end of next business day (CMF art. L133-18) - mock returns refund_due_by on block."
    - "Disputes: cardholder contestation window 13 months after debit (CMF art. L133-24); scheme impayé reason codes and deadlines *to confirm* (CB rulebook)."
    - "Fraud report: fraud type list of the GIE CB declaration *to confirm*; mock accepts the same 0-6 list labelled in French."
